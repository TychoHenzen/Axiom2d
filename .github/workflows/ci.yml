name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/Cargo.toml --all --check
      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets --keep-going -- -D warnings
          cargo clippy --manifest-path tools/Cargo.toml --workspace --all-targets --keep-going -- -D warnings
      - name: Build and test engine workspace
        run: |
          cargo build --workspace
          cargo test --workspace
      - name: Build and test tools workspace
        run: |
          cargo build --manifest-path tools/Cargo.toml --workspace
          cargo test --manifest-path tools/Cargo.toml --workspace

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          file: Cargo.lock
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
          createIssues: "false"
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          file: tools/Cargo.lock
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
          createIssues: "false"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check workflow syntax and embedded shell
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  visual-regression:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system and software GPU dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev mesa-vulkan-drivers
      - name: Run visual regression tests
        env:
          WGPU_BACKEND: vulkan
        run: cargo test -p engine_render --test main -- --test-threads=1
