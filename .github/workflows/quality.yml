name: Quality

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --keep-going --locked -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          file: Cargo.lock
          # Linux-only wayland-scanner still brings quick-xml below 0.41 transitively.
          # Keep these two IDs scoped to that upstream path until it publishes a fix.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
          createIssues: "false"
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          file: tools/Cargo.lock
          # wayland-scanner and zbus_xml pin the affected quick-xml versions transitively.
          # The tools workspace's direct quick-xml dependency is already on 0.41.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
          createIssues: "false"

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.extract.outputs.coverage_pct }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-llvm-cov
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Generate coverage
        id: extract
        run: |
          mkdir -p quality/coverage
          set +e
          cargo llvm-cov --workspace --locked -- --test-threads=1 2>&1 | tee coverage.log
          coverage_status=${PIPESTATUS[0]}
          set -e
          if [ "$coverage_status" -ne 0 ]; then
            echo "::error title=Coverage Tests Failed::cargo llvm-cov exited with status ${coverage_status}" >&2
            exit "$coverage_status"
          fi
          cargo llvm-cov report --workspace --locked --lcov --output-path quality/coverage/lcov.info
          if ! COV_PCT=$(awk '
            $1 == "TOTAL" {
              coverage = $10
              sub(/%$/, "", coverage)
              print coverage
              found = 1
              exit
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' coverage.log); then
            echo "::error title=Coverage Summary Missing::cargo llvm-cov summary did not contain a TOTAL Lines Cover value" >&2
            exit 1
          fi
          if [[ ! "$COV_PCT" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error title=Coverage Summary Invalid::coverage_pct is not numeric: ${COV_PCT}" >&2
            exit 1
          fi
          echo "coverage_pct=${COV_PCT}" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COV_PCT}"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: quality/coverage/

  complexity:
    runs-on: ubuntu-latest
    outputs:
      cyclo_over_10: ${{ steps.cyclo.outputs.cyclo_over_10 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install arborist-cli
        run: cargo install arborist-cli --locked
      - name: Count functions with CC > 10
        id: cyclo
        run: |
          # arborist --exceeds-only --threshold N filters by cognitive, not cyclomatic.
          # Use JSON output and count cyclomatic > 10 in python.
          COUNT=$(arborist crates/ --languages rust --format json 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          total = 0
          for file_entry in data:
              for func in file_entry.get('functions', []):
                  if func.get('cyclomatic', 0) > 10:
                      total += 1
          print(total)
          ")
          echo "cyclo_over_10=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Functions with CC > 10: ${COUNT}"

  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Check for unused dependencies
        run: cargo +nightly udeps --workspace --all-targets --locked

  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install naga-cli
        run: cargo install naga-cli --locked
      - name: Validate WGSL shaders
        run: |
          preamble="crates/engine_render/src/wgpu_renderer/bloom_preamble.wgsl"
          find crates -name '*.wgsl' | while read -r shader; do
            echo "Validating $shader"
            case "$shader" in
              *bloom_frag.wgsl|*bloom_composite.wgsl)
                tmp=$(mktemp /tmp/shader_XXXXXX.wgsl)
                cat "$preamble" "$shader" > "$tmp"
                naga "$tmp"
                rm "$tmp"
                ;;
              *)
                naga "$shader"
                ;;
            esac
          done

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check for dead code
        run: cargo build --workspace --all-targets --locked
        env:
          RUSTFLAGS: "-D dead_code"

  duplicates:
    runs-on: ubuntu-latest
    outputs:
      clone_count: ${{ steps.jscpd.outputs.clone_count }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Detect duplicate code
        id: jscpd
        run: |
          mkdir -p quality/duplicates
          npx jscpd crates/ --pattern "**/*.rs" --min-tokens 50 --min-lines 5 --mode strict --reporters consoleFull --output quality/duplicates 2>&1 | tee jscpd.log
          CLONE_COUNT=$(grep -c "Clone found" jscpd.log || echo "0")
          echo "clone_count=${CLONE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Clones found: ${CLONE_COUNT}"
      - name: Upload duplicate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jscpd-report
          path: quality/duplicates/

  micro-mutations:
    name: "Micro-mutations (randomized subset)"
    runs-on: ubuntu-latest
    environment: default
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # Rust 1.94.0
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run micro-mutations
        id: mutations
        run: |
          mkdir -p quality
          bash scripts/micro-mutations.sh
        env:
          MICRO_SAMPLE_SIZE: ${{ vars.MICRO_SAMPLE_SIZE }}
          MICRO_TIMEOUT: ${{ vars.MICRO_TIMEOUT }}
        continue-on-error: true

      - name: Upload micro-mutation state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-mutation-state
          path: |
            quality/.micro_mutation_state.json
            quality/MICRO_MUTATIONS.md
          if-no-files-found: warn

  soft-gate:
    name: "Soft Ratchet Gate (no regressions allowed)"
    runs-on: ubuntu-latest
    needs: [clippy, audit, doc, udeps, shaders, dead-code, duplicates, complexity, coverage]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test quality gate comparator
        run: bash scripts/quality-gate-check-test.sh

      - name: Parse baseline
        id: baseline
        run: |
          # Extract numeric baseline values from RON file.
          # Use sed to capture number after colon — avoids capturing digits in key names
          # (e.g. "cyclomatic_over_10": 29  must return 29, not 10).
          extract_val() {
            sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\([0-9.]\+\).*/\\1/p" docs/QUALITY_BASELINE.ron | head -1
          }
          test_count=$(extract_val "test_count_total")
          smell=$(extract_val "smell_markers_total")
          unsafe=$(extract_val "unsafe_blocks_total")
          unwrap=$(extract_val "unwrap_in_prod_total")
          cyclo=$(extract_val "cyclomatic_over_10")
          cov=$(extract_val "line_coverage_pct")
          clones=$(extract_val "jscpd_clone_count")
          expect=$(extract_val "expect_in_prod_total")
          {
            echo "test_count=${test_count:-0}"
            echo "smell=${smell:-0}"
            echo "unsafe=${unsafe:-0}"
            echo "unwrap=${unwrap:-0}"
            echo "cyclo=${cyclo:-0}"
            echo "cov=${cov:-0}"
            echo "clones=${clones:-0}"
            echo "expect=${expect:-92}"
          } >> "$GITHUB_OUTPUT"

      - name: Count test functions
        id: tests
        run: |
          count=$(grep -rnc '#\[test\]\|#\[tokio::test\]' crates/ --include="*.rs" | awk -F: '{total += $NF} END {print total + 0}')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Count smell markers (prod code only)
        id: smells
        run: |
          count=$(grep -rn 'TODO\|FIXME\|HACK' crates/ --include="*.rs" | grep -v 'tests/' | grep -c .)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Count unsafe blocks (prod code only)
        id: unsafe_blocks
        run: |
          count=$(grep -rn '\bunsafe\b' crates/ --include="*.rs" | grep -v 'tests/' | grep -c .)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Count unwrap() in production
        id: unwrap_count
        run: |
          count=$(grep -rn '\.unwrap()' crates/ --include="*.rs" | grep -v 'tests/' | grep -v 'benches/' | grep -v 'particle_poc/' | grep -c .)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Check ratchets
        id: ratchets
        run: |
          set -e
          FAILED=0
          check_ratchet() {
            local name=$1 current=$2 baseline=$3 direction=$4
            if [ "$direction" = "higher" ]; then
              if [ "$current" -lt "$baseline" ]; then
                echo "::error title=Quality Regression::$name regressed: $current < $baseline (baseline)"
                FAILED=1
              elif [ "$current" -gt "$baseline" ]; then
                echo "::notice title=Quality Improved::$name improved: $current > $baseline (baseline). Update the baseline in a reviewed change if desired."
              else
                echo "::notice title=$name (ok)::$name: $current (baseline: $baseline)"
              fi
            else
              if [ "$current" -gt "$baseline" ]; then
                echo "::error title=Quality Regression::$name regressed: $current > $baseline (baseline)"
                FAILED=1
              elif [ "$current" -lt "$baseline" ]; then
                echo "::notice title=Quality Improved::$name improved: $current < $baseline (baseline). Update the baseline in a reviewed change if desired."
              else
                echo "::notice title=$name (ok)::$name: $current (baseline: $baseline)"
              fi
            fi
          }

          # Integer comparisons
          check_ratchet "test_count"      "${{ steps.tests.outputs.count }}"         "${{ steps.baseline.outputs.test_count }}" "higher"
          check_ratchet "smell_markers"   "${{ steps.smells.outputs.count }}"         "${{ steps.baseline.outputs.smell }}"      "lower"
          check_ratchet "unsafe_blocks"   "${{ steps.unsafe_blocks.outputs.count }}"  "${{ steps.baseline.outputs.unsafe }}"     "lower"
          check_ratchet "unwrap_in_prod"  "${{ steps.unwrap_count.outputs.count }}"   "${{ steps.baseline.outputs.unwrap }}"     "lower"

          check_ratchet "cyclomatic_over_10" "${{ needs.complexity.outputs.cyclo_over_10 }}"  "${{ steps.baseline.outputs.cyclo }}"     "lower"
          check_ratchet "jscpd_clone_count"  "${{ needs.duplicates.outputs.clone_count }}"     "${{ steps.baseline.outputs.clones }}"    "lower"

          # Coverage is float — compare at baseline precision, matching the local gate.
          cov_current="${{ needs.coverage.outputs.coverage_pct }}"
          cov_baseline="${{ steps.baseline.outputs.cov }}"
          compare_floats() {
            awk -v current="$1" -v baseline="$2" '
              BEGIN {
                precision = 0
                decimal = index(baseline, ".")
                if (decimal > 0) {
                  precision = length(baseline) - decimal
                }
                scale = 1
                for (i = 0; i < precision; i++) {
                  scale *= 10
                }
                current = int((current * scale) + 0.5 + 1e-9)
                baseline = int((baseline * scale) + 0.5 + 1e-9)
                if (current < baseline) {
                  print -1
                } else if (current > baseline) {
                  print 1
                } else {
                  print 0
                }
              }
            '
          }
          cov_compare=$(compare_floats "$cov_current" "$cov_baseline")
          if [ "$cov_compare" -lt 0 ]; then
            echo "::error title=Quality Regression::line_coverage regressed: ${cov_current}% < ${cov_baseline}% (baseline)"
            FAILED=1
          elif [ "$cov_compare" -gt 0 ]; then
            echo "::notice title=Quality Improved::line_coverage improved: ${cov_current}% > ${cov_baseline}% (baseline). Update the baseline in a reviewed change if desired."
          else
            echo "::notice title=line_coverage (ok)::line_coverage: ${cov_current}% (baseline: ${cov_baseline}%)"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "::error::One or more quality metrics regressed. See above for details."
            echo "To intentionally increase a baseline, edit docs/QUALITY_BASELINE.ron overrides section with a reason."
            exit 1
          fi

          echo "All soft ratchets passed. Quality has not regressed."

